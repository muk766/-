<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปสถิติแบบสอบถาม</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border-top: 10px solid #1a73e8;
      max-width: 900px;
      margin: auto;
    }
    h1 { color: #1a73e8; font-size: 24px; text-align: center; }
    
    /* ส่วนแสดงตัวเลขสรุป (Summary Cards) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .stat-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #e9ecef;
    }
    .stat-card h3 { margin: 0; color: #5f6368; font-size: 16px; }
    .stat-card p { margin: 10px 0 0; color: #1a73e8; font-size: 32px; font-weight: bold; }

    /* ส่วนของกราฟ */
    .chart-container { margin-bottom: 40px; padding: 20px; border: 1px solid #eee; border-radius: 15px; }
    
    .btn-back {
      display: inline-block;
      margin-top: 20px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📊 สรุปผลและสถิติการใช้งาน</h1>
  
  <div class="stats-grid">
    <div class="stat-card">
      <h3>ผู้ตอบแบบสอบถาม</h3>
      <p id="total-responses">32 </p>
    </div>
    <div class="stat-card">
      <h3>คะแนนความพึงพอใจเฉลี่ย</h3>
      <p id="avg-score">4.2 / 5</p>
    </div>
    <div class="stat-card">
      <h3>วิธีที่นิยมที่สุด</h3>
      <p id="top-method" style="font-size: 24px;">แอปพลิเคชัน</p>
    </div>
  </div>

  <hr style="border: 0.5px solid #eee; margin: 30px 0;">

  <div class="chart-container">
    <h3 style="text-align: center; color: #5f6368;">สัดส่วนการใช้งานช่องทางต่างๆ</h3>
    <canvas id="usageChart"></canvas>
  </div>

  <div class="chart-container">
    <h3 style="text-align: center; color: #5f6368;">ความพึงพอใจแยกตามประเภท (คะแนนเต็ม 5)</h3>
    <canvas id="scoreChart"></canvas>
  </div>

  <a href="1.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
</div>

<script>
  // ข้อมูลสมมติสำหรับแสดงผลกราฟ
  // กราฟวงกลม (Pie Chart)
  const ctxUsage = document.getElementById('usageChart').getContext('2d');
  new Chart(ctxUsage, {
    type: 'pie',
    data: {
      labels: ['บัตรนักเรียน', 'แอปพลิเคชัน', 'เงินสด'],
      datasets: [{
        data: [37.5, 50, 12.5],
        backgroundColor: ['#4285f4', '#34a853', '#fbbc05']
      }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });

  // กราฟแท่ง (Bar Chart)
  const ctxScore = document.getElementById('scoreChart').getContext('2d');
  new Chart(ctxScore, {
    type: 'bar',
    data: {
      labels: ['ความรวดเร็ว', 'ความสะดวก', 'ความปลอดภัย'],
      datasets: [{
        label: 'คะแนนเฉลี่ย',
        data: [4.5, 4.2, 3.8],
        backgroundColor: '#1a73e8'
      }]
    },
    options: {
      scales: { y: { beginAtZero: true, max: 5 } }
    }
  });

</script>

</body>
</html>
